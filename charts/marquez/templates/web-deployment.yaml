---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marquez.fullname" . }}-web
  labels:
    app.kubernetes.io/name: marquez-web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: marquez-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marquez-web
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: marquez-web
          image: {{ .Values.image.web }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: MARQUEZ_HOST
              value: {{ include "marquez.fullname" . }}-api
            - name: MARQUEZ_PORT
              value: "5000"
            - name: WEB_PORT
              value: "5002"
          ports:
            - containerPort: 5002
          {{- with .Values.resources.web }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
