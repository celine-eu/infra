## ----------------------------------------------------------------------------
## celine-frontend-community — values.yaml
## ----------------------------------------------------------------------------

fullnameOverride: frontend-community

image:
  repository: ghcr.io/celine-eu/celine-frontend-community
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3007

ingress:
  enabled: true
  domain: celine.test
  host: "community.celine.test"
  issuer: celine-tls

  communityBackend:
    service: community
    port: 8019

  auth:
    enabled: true
  tls:
    enabled: true
    secretName: ""
  annotations: {}

# Response headers ingress-nginx adds on this host's Ingresses (custom-headers; README
# "Security headers"). Off only in the dev environment.
# SvelteKit (adapter-node, ssr off, no kit.csp): an inline bootstrap and theme script,
# inline style attributes. Same-origin /api; the area map's OpenStreetMap tiles are
# images (Leaflet).
securityHeaders:
  enabled: true
  referrerPolicy: strict-origin-when-cross-origin
  csp:
    reportOnly: false
    directives:
      default-src: "'self'"
      script-src: "'self' 'unsafe-inline'"
      style-src: "'self' 'unsafe-inline'"
      img-src: "'self' data: blob: https://*.tile.openstreetmap.org"
      font-src: "'self'"
      connect-src: "'self'"
      object-src: "'none'"
      base-uri: "'self'"
      form-action: "'self' https://sso.{{ .Values.ingress.domain }} https://keycloak.{{ .Values.ingress.domain }}"
      frame-ancestors: "'none'"

healthCheck:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3

extraEnv: []
podAnnotations: {}
podSecurityContext:
  runAsUser: 1000
resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 100m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
