# Namespaces whose pods may open connections to every pod of this namespace, besides the
# namespace itself (the ingress controller's, the CNPG operator's, ...). infra fills it from
# `network_policy.*` (defaults/0010-core/celine-network-policy).
allowNamespaces: []
# Single workloads of other namespaces: `{namespace, labels}` each, admitting only that
# namespace's pods that carry every one of `labels`. infra fills it from
# `network_policy.allow_pods`.
allowPods: []
