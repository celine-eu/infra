{{- /* Every pod of the namespace refuses incoming connections... */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
{{- /* ...except from the namespace itself, the namespaces in `allowNamespaces` and the pods
       in `allowPods` (namespace and pod selector in one peer: both must match).
       Egress stays open: no policy here selects it. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-perimeter
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- with .Values.allowNamespaces }}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{ toJson . }}
        {{- end }}
        {{- range .Values.allowPods }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .labels }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
        {{- end }}
