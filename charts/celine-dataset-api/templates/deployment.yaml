{{- /* extraEnvAppend: entries added after extraEnv, so an environment adds settings
       without restating the chart's own list. Empty: the library Deployment as is. */}}
{{- if .Values.extraEnvAppend }}
{{- $v := deepCopy .Values }}
{{- $_ := set $v "extraEnv" (concat (.Values.extraEnv | default list) .Values.extraEnvAppend) }}
{{ include "celine-services.deployment" (dict "Values" $v "Release" .Release "Chart" .Chart "Capabilities" .Capabilities "Template" .Template) }}
{{- else }}
{{ include "celine-services.deployment" . }}
{{- end }}
