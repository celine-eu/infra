## ----------------------------------------------------------------------------
## celine-onboarding — values.yaml
##
## The REC onboarding API: the public member wizard's backend and the operator
## console's API. The UI is a separate release (celine-frontend-onboarding),
## whose ingress routes /api here.
##
## The service reads flat OIDC_* / SMTP_* / … variables, not CELINE_OIDC_*: the
## chart renders them from the `onboarding` block below (templates/_helpers.tpl).
## The library's CELINE_OIDC_* variables are rendered too and read by nothing.
## ----------------------------------------------------------------------------

fullnameOverride: onboarding

image:
  repository: ghcr.io/celine-eu/onboarding
  tag: "latest"
  pullPolicy: IfNotPresent

# The image's CMD is `uv run uvicorn …`, which needs a writable uv cache and
# project directory; the pod runs as a non-root user and /app belongs to root.
# The virtualenv's own binaries need neither.
command:
  - /app/.venv/bin/uvicorn
  - celine.onboarding.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8040"

replicaCount: 1

service:
  type: ClusterIP
  port: 8040

# No ingress of its own: celine-frontend-onboarding owns the host and routes
# /api here, with /api/admin and /api/me behind oauth2-proxy.
ingress:
  enabled: false
  domain: celine.test
  host: ""
  issuer: celine-tls
  auth:
    enabled: false
  tls:
    enabled: false
    secretName: ""
  annotations: {}

# Inbound tokens (operators via oauth2-proxy, service accounts) and the
# service's own outbound client. baseUrl is compared with the token's `iss`, so
# it is the realm's public URL.
oidc:
  baseUrl: "https://keycloak.celine.test/realms/celine"
  jwksUri: "https://keycloak.celine.test/realms/celine/protocol/openid-connect/certs"
  allowedAudiences: ""
  includeClientIdAsAudience: true
  timeout: 10.0
  service:
    clientId: "svc-onboarding"
    audience: "svc-onboarding"
    clientSecret: "svc-onboarding" # [secret]

# The policy bundle (CELINE_POLICIES_*), rendered by the library. Onboarding reads
# CELINE_POLICIES_DIR for its admin-console policies, as every service does.
policies:
  dir: "/app/policies"
  dataDir: ""
  cacheEnabled: true
  cacheTtl: 300
  cacheMaxsize: 10000

# DATABASE_URL, from the Secret charts/postgres-db publishes for database
# `onboarding` (dialect postgresql+asyncpg).
postgres:
  existingSecret: "postgis1-onboarding-connection-string"
  dsnEnvVar: "DATABASE_URL"
  secretKey: "connection-string"

s3:
  endpointUrl: ""
  region: "us-east-1"
  existingSecret: ""

# Alembic, as an init container of the API pod (the library's pattern): it runs
# before the new API container starts, after the release's secrets exist.
migrate:
  enabled: true
  command: ["/app/.venv/bin/alembic", "upgrade", "head"]
  extraEnv: []

healthCheck:
  enabled: true
  path: /api/health
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

onboarding:
  # Where uvicorn accepts X-Forwarded-For from: the ingress controller's pod
  # address range. REQUIRED, and never "*" or a /0 — every rate limit, consent
  # evidence IP and audit row is the address uvicorn resolves (onboarding README,
  # "Security"). The chart refuses to render without it; the helmfile defaults
  # supply 0.0.0.0 (no peer has it: no proxy trusted) until an environment sets
  # the range.
  forwardedAllowIps: ""

  # Fernet key for the personal data at rest. REQUIRED; no default, because a
  # guessable key encrypts nothing. Losing it loses every submission's data.
  encryptionKey: "" # [secret]

  # Off: no dataspace identity, and the registry member is written as
  # oidc.service.clientId. A template that declares `consent.data_sharing`
  # also needs dsConnectorUrl, or the API refuses to start.
  dataspaceEnabled: false
  dsConnectorUrl: ""
  dsOnboardingClientSecret: "" # [secret] only when dataspaceEnabled
  identityRegistryUrl: ""
  # Each community's collector-client secret, by alias (the REC's
  # `dataspace.organization`): SVC_DS_COLLECTOR_<ALIAS>_SECRET, the alias
  # upper-cased with '-' as '_'. Only when dataspaceEnabled.
  dsCollectorSecrets: {} # [secret] alias -> secret
  # REC_ASSERTION_HMAC_KEY: the key of the community's key assertion
  # (onboarding `config/settings.py`). Empty: not set.
  recAssertionHmacKey: "" # [secret]

  # The CLI's service account (`onboarding-cli admin …` in the pod).
  cliClientId: "svc-onboarding-cli"
  cliClientSecret: "svc-onboarding-cli" # [secret]
  # The API as the CLI inside the pod reaches it.
  apiUrl: "http://onboarding:8040"

  # In-cluster dependencies. The provisioning service has no public route and
  # must not be given one.
  recRegistryUrl: "http://rec-registry:8004"
  digitalTwinUrl: "http://digital-twin:8002"
  provisioningUrl: "http://provisioning:8010"

  # Comma-separated, e.g. https://onboarding.<domain>
  corsOrigins: ""

  # Document scanning sends bills and ID cards to a model endpoint: off unless
  # it is in-house or a processing agreement covers it (onboarding README), and
  # unless the endpoint and its vision model are named. Uploads then need
  # persistence below.
  extractionEnabled: false
  llm:
    baseUrl: ""      # OpenAI-compatible, e.g. a self-hosted vLLM; no default
    visionModel: ""
    apiKey: ""       # [secret] only if the endpoint needs one
    # LLM_THINKING: "false" asks the model to skip its reasoning phase (a reasoning
    # model can spend the extractor's token cap on it). Empty: not set, the
    # service's own default.
    thinking: ""

  # Phone verification by SMS. The service's own default, `log`, is a
  # development provider: it prints the code to the pod log and the participant
  # never receives it. `none` switches verification off (the wizard drops the
  # phone_verify step). `brevo` sends real SMS, and only with dpaSmsSigned:
  # the gateway receives participants' phone numbers (GDPR Art. 28).
  smsProvider: "none"
  dpaSmsSigned: false
  brevoSmsSender: ""
  brevoApiKey: "" # [secret] only with smsProvider: brevo
  # OTP_HMAC_KEY: keys the OTP hashes (onboarding `config/posture.py`). The
  # service refuses to start without it while phone verification is on, or
  # when it equals an ENCRYPTION_KEY key. Empty: not set.
  otpHmacKey: "" # [secret]

  # Empty host: no email at all. Never left to the service's own default,
  # which is a development Mailpit. STARTTLS (tls: true) or plain; the
  # service has no implicit-TLS (port 465) mode.
  smtp:
    host: ""
    port: 587
    user: ""
    password: "" # [secret]
    from: ""
    tls: true
    notify: ""

# The community templates, mounted from a ConfigMap at mountPath (TEMPLATES_DIR).
# Keys are paths under that directory: `<slug>/manifest.yaml`,
# `<slug>/content/welcome.md`, `<slug>/consent/policy.pdf`, … The image's own
# templates/ directory is not read. After a template changes, import it:
#   kubectl exec deploy/onboarding -- /app/.venv/bin/onboarding-cli import-templates --filter <slug>
# A ConfigMap holds at most 1 MiB; larger consent documents go in the manifest
# as `url:` entries instead of files.
templates:
  mountPath: /app/rec-templates
  # path → text
  files: {}
  # path → base64 (PDFs, images)
  binaryFiles: {}

# DATA_DIR: uploaded documents (only with extractionEnabled) and short-lived
# exports. emptyDir unless enabled. A ReadWriteOnce claim can hold a rolling
# update on a multi-node cluster, so with one the Deployment uses the Recreate
# strategy unless `strategy` below says otherwise.
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /app/data

# The Deployment's rollout strategy. Empty: Recreate when persistence uses a
# ReadWriteOnce claim (the old pod must release it before the new one mounts
# it), the Kubernetes default (RollingUpdate) otherwise.
strategy: {}

logLevel: "INFO"
extraEnv: []
extraSecrets: {}
volumeMounts: []
volumes: []

podAnnotations: {}
podSecurityContext:
  runAsUser: 1000
  fsGroup: 1000
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
