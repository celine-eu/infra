{{- if and .Values.bootstrap.enabled .Values.bootstrap.smtp.host .Values.bootstrap.smtp.auth }}
# SMTP credentials for `bootstrap`, kept out of the pod spec.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celine-policies-shell.fullname" . }}-bootstrap-smtp
  labels:
    {{- include "celine-policies-shell.labels" . | nindent 4 }}
type: Opaque
stringData:
  user: {{ .Values.bootstrap.smtp.user | quote }}
  password: {{ .Values.bootstrap.smtp.password | quote }}
{{- end }}
