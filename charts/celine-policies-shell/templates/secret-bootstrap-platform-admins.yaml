{{- with include "celine-policies-shell.platformAdminPasswordEnv" . | fromYaml }}
{{- if . }}
# The temporary passwords `bootstrap` creates declared platform-admin accounts with
# (celine-policies REQ-0022), read by the bootstrap init container only.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celine-policies-shell.fullname" $ }}-bootstrap-platform-admins
  labels:
    {{- include "celine-policies-shell.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
