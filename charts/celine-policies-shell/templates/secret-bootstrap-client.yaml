{{- if .Values.keycloak.bootstrapClient.secret }}
# The master-realm bootstrap client's secret (CELINE_KEYCLOAK_BOOTSTRAP_CLIENT_SECRET), for
# the bootstrap init container and the shell, kept out of the pod spec.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celine-policies-shell.fullname" . }}-bootstrap-client
  labels:
    {{- include "celine-policies-shell.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ .Values.keycloak.bootstrapClient.secret | quote }}
{{- end }}
