{{- if .Values.keycloak.adminPassword }}
# The master administrator's password (`keycloak.adminPassword`), for an environment whose
# Keycloak runs elsewhere and so has no admin Secret of its own here. Used instead of
# `keycloak.existingSecret`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celine-policies-shell.fullname" . }}-keycloak-admin
  labels:
    {{- include "celine-policies-shell.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.keycloak.adminPassword | quote }}
{{- end }}
