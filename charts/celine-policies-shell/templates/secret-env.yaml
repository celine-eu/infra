{{- if .Values.secretEnv }}
# The shell's secret environment (secretEnv): the client secrets the start-up sync
# substitutes into clients.yaml, loaded by the shell with envFrom and kept out of the pod spec.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celine-policies-shell.fullname" . }}-env
  labels:
    {{- include "celine-policies-shell.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $k) }}
  {{- fail (printf "secretEnv: %s is not an environment variable name" $k) }}
  {{- end }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
