{{- if and .Values.bootstrap.enabled .Values.bootstrap.realmAdmin.username .Values.bootstrap.realmAdmin.password }}
# The operator realm admin's initial password, for `bootstrap`, kept out of the pod spec.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celine-policies-shell.fullname" . }}-bootstrap-realm-admin
  labels:
    {{- include "celine-policies-shell.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.bootstrap.realmAdmin.password | quote }}
{{- end }}
