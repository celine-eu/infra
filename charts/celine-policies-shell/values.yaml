## ----------------------------------------------------------------------------
## celine-policies-shell — values.yaml
##
## Long-running shell pod for maintenance tasks against celine-policies.
## Primary use case: running the celine-policies CLI to sync Keycloak
## clients/scopes from clients.yaml.
##
## Usage after deploy:
##   # Copy clients.yaml into the pod
##   kubectl cp clients.yaml <pod>:/tmp/clients.yaml
##
##   # Run the sync
##   kubectl exec -it <pod> -- \
##     .venv/bin/celine-policies keycloak sync /tmp/clients.yaml
##
##   # Is the realm's platform level what platform.yaml declares? (exits 1 on drift)
##   kubectl exec -it <pod> -- celine-policies keycloak bootstrap --check
##
## On every start, two init containers run `keycloak bootstrap` (plan, apply, check) before
## the shell's `sync`, and store the run (see `bootstrap` below). A failed bootstrap or sync
## fails the pod. Do not run `bootstrap` by hand while a pod is starting.
## ----------------------------------------------------------------------------

image:
  repository: ghcr.io/celine-eu/celine-policies
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""

fullnameOverride: "policies-shell"

# --------------------------------------------------------------------------
# Keycloak connection settings
# All fields map to CELINE_KEYCLOAK_* environment variables (KeycloakSettings).
# --------------------------------------------------------------------------
keycloak:
  # Base URL of the Keycloak instance reachable from within the cluster.
  baseUrl: "http://keycloak"
  realm: "celine"

  # Admin credentials — typically injected from the keycloak secret.
  # If existingSecret is set, adminUser and adminPassword are read from there.
  adminUser: "admin"

  # Reference an existing Secret that holds the admin password and
  # optionally the admin client secret (for service-account auth).
  # The Secret must contain the keys defined by adminPasswordKey /
  # adminClientSecretKey below.
  existingSecret: "keycloak-admin-credentials"
  adminPasswordKey: "admin-password"
  adminClientSecretKey: "" # optional; only if using client-credentials flow

# --------------------------------------------------------------------------
# keycloak bootstrap: the realm's platform level, before `sync`
# --------------------------------------------------------------------------
bootstrap:
  enabled: true
  # Passed as --allow-destructive: a plan that turns a setting off or removes a list entry
  # is refused without it. Set for one release, then unset.
  allowDestructive: false
  # CELINE_KEYCLOAK_BRUTE_FORCE_ENABLED. Empty: not set, and bootstrap turns brute force on.
  bruteForceEnabled: ""
  waitRetries: 20
  waitDelaySeconds: 15
  # An overlay on platform.yaml (realm_settings.supportedLocales only). Empty: none.
  overlay: {}
  # CELINE_KEYCLOAK_SMTP_*. Empty host: smtpServer is left alone. user and password go
  # into a Secret, never into the pod spec.
  smtp:
    host: ""
    port: 587
    from: ""
    fromDisplayName: ""
    replyTo: ""
    ssl: false
    starttls: false
    auth: false
    user: ""
    password: ""
  # CELINE_KEYCLOAK_REALM_ADMIN_*: the operator realm admin, created once (it needs the
  # password then) and kept in /admins. Empty username: none is managed. The password goes
  # into a Secret, and is never re-sent to an existing account.
  realmAdmin:
    username: ""
    email: ""
    firstName: ""
    lastName: ""
    password: ""
  # Where each run's export, plan, apply and check output is stored.
  record:
    image: "curlimages/curl:8.21.0"
    # Empty: nothing is stored, and the run is in the init containers' logs only.
    bucket: ""
    # A Secret with S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY and S3_ENDPOINT_URL.
    s3Secret: ""
    region: us-east-1
    # The first path segment. Default: the release namespace.
    environment: ""

# --------------------------------------------------------------------------
# Extra environment variables (plain value or secretKeyRef)
# --------------------------------------------------------------------------
# Client secrets — substituted into clients.yaml during keycloak sync.
# Values here match the ${VAR:-default} fallbacks defined in clients.yaml.
# Override via secretKeyRef in production (e.g. from the SOPS-decrypted secret).
extraEnv:
  - name: SVC_DT_SECRET
    value: "svc-digital-twin"
  - name: SVC_PIPELINES_SECRET
    value: "svc-pipelines"
  - name: SVC_DATASET_SECRET
    value: "svc-dataset-api"
  - name: SVC_NUDGING_SECRET
    value: "svc-nudging"
  - name: SVC_REC_REGISTRY_SECRET
    value: "svc-rec-registry"
  - name: SVC_GRID_SECRET
    value: "svc-grid"
  - name: CELINE_ADMIN_CLI_SECRET
    value: "celine-cli"
# Example secretKeyRef override:
#   - name: SVC_DT_SECRET
#     secret: celine-client-secrets
#     key: svc-dt-secret

# --------------------------------------------------------------------------
# Extra volume mounts — useful for mounting a ConfigMap with clients.yaml
# so you don't have to kubectl cp every time.
# --------------------------------------------------------------------------
volumeMounts: []
volumes: []

# Example — mount clients.yaml from a ConfigMap:
#
# volumeMounts:
#   - name: clients-config
#     mountPath: /etc/celine-policies
#     readOnly: true
#
# volumes:
#   - name: clients-config
#     configMap:
#       name: celine-policies-clients

# --------------------------------------------------------------------------
# Pod
# --------------------------------------------------------------------------
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
