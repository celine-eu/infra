# sync_tables (celine-eu/demo3 utils/sync_tables): copies warehouse tables between
# environments, only along the edges the tool compiles in, and only between databases that
# carry an environment marker (postgres-db `envMarker`). Two roles, each enabled on its own:
#
# - sink: holds a database and applies what a source sends. Served behind the ingress
#   controller on one route, with mutual TLS against a CA used only for this sync.
# - pushSource: a CronJob that reads its database and dials a sink.
# - serve: a serving source that reads its database and answers pulls from developers'
#   machines (dev -> local), behind the ingress. Client certificates are optional there
#   (`serve.clientCerts`): where the host is reachable only from a private network, the
#   network is the gate and each developer holds a named token.
#
# Tokens: `tokens` maps a holder's name to its token (one Secret key each, mounted as a
# directory the tool re-reads, so removing a holder revokes it without a restart). The
# names appear in the listener's log of accepted connections; the tokens never do.

# The sync_tables image, as one reference (registry/name:tag or @digest). Required.
image: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# The image runs as uid 10001; fsGroup lets it read the mounted key and token (0440).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# DNS for the NetworkPolicies' egress rules (port 53 to any destination when empty).
dnsSelector: {}

sink:
  enabled: false
  host: ""                        # required: the public host of the sink
  path: /sync/v1
  ingressClassName: nginx
  # How the ingress checks client certificates; required, no default:
  # - traefik: a native IngressRoute, a TLSOption requiring a client certificate from
  #   the push CA, an ipAllowList (allowSourceRanges, required) and passTLSClientCert. Needs
  #   Traefik's kubernetesCRD provider. Use it on Traefik even where the NGINX provider is
  #   on: that provider is not relied on for client certificates.
  # - nginx: an Ingress with ingress-nginx's auth-tls-* annotations.
  # Either way the ingress forwards the client certificate it verified and the sink checks
  # it again against the push CA (--require-upstream-client-cert): an ingress that stops
  # verifying makes every push fail with `client_cert_unverified`, never open the route.
  ingressFlavor: ""
  traefik:
    entryPoint: websecure
  # The mirror role's DSN (SYNC_SINK_DSN), from an existing Secret. Required.
  dsnSecret:
    name: ""
    key: connection-string
  tokens: {}                      # required: {holder: token}, e.g. {push: …}
  ca: ""                          # required: PEM, the push CA that signed the client certificate
  serverCert: ""                  # required: PEM, signed by the sync CA (served by the ingress)
  serverKey: ""                   # required: PEM
  allowSchemas: []                # required: the only schemas the sink writes, one per entry
  allowSourceRanges: ""           # CIDRs allowed to reach the route, comma-separated; required with traefik
  proxyTimeoutSeconds: 3600       # one table per transaction can run long
  proxyBodySize: 16m
  listenPort: 8443                # plain HTTP behind the ingress (--tls-terminated-upstream)
  healthPort: 8081
  replicas: 1
  resources: {}
  authLimits: {}                  # optional: failMax, failWindow, lockout, failGlobalMax (tool defaults)
  networkPolicy:
    enabled: true
    ingressNamespace: ingress     # where the ingress controller's pods run
    # Pods the sink may reach on 5432: the database it writes.
    databasePodSelector:
      cnpg.io/cluster: postgis1

serve:
  enabled: false
  host: ""                        # required: the public host of the serving source
  path: /sync/v1
  ingressClassName: nginx
  # The source database URL (SYNC_SOURCE_DSN), from an existing Secret. Required.
  dsnSecret:
    name: ""
    key: connection-string
  tokens: {}                      # required: {holder: token}, one per developer
  # Require a client certificate from `ca` at the ingress. Off: server TLS only, and the
  # network the host is reachable from is the gate (an internal-only host).
  clientCerts: true
  ca: ""                          # PEM, the pull CA; required with clientCerts
  serverCert: ""                  # required: PEM, signed by the pull CA (served by the ingress)
  serverKey: ""                   # required: PEM
  allowSchemas: []                # required: the only schemas it reads, one per entry
  allowSourceRanges: ""           # optional: CIDRs allowed to reach the route, comma-separated
  proxyTimeoutSeconds: 3600       # one table per transaction can run long
  proxyBodySize: 16m
  listenPort: 8443                # plain HTTP behind the ingress (--tls-terminated-upstream)
  healthPort: 8081
  replicas: 1
  resources: {}
  # Behind NAT every developer arrives from one address, so a per-address lockout is a
  # team-wide one: keep it short. Keys: failMax, failWindow, lockout, failGlobalMax.
  authLimits:
    failMax: 20
    lockout: 60
  networkPolicy:
    enabled: true
    ingressNamespace: ingress     # where the ingress controller's pods run
    # Pods the serving source may reach on 5432: the database it reads.
    databasePodSelector:
      cnpg.io/cluster: postgis1

pushSource:
  enabled: false
  schedule: "*/30 * * * *"
  from: dev
  to: prod
  sinkUrl: ""                     # required: wss://<sink host>/sync/v1
  # The source database URL (DB_DEV), from an existing Secret. Required.
  sourceSecret:
    name: ""
    key: connection-string
  token: ""                       # required
  ca: ""                          # required: PEM, the sync CA (the only CA the source trusts)
  clientCert: ""                  # required: PEM, signed by the sync CA
  clientKey: ""                   # required: PEM
  profile: ""                     # required: the profile YAML (the table list), as a string
  activeDeadlineSeconds: 7200
  resources: {}
  networkPolicy:
    enabled: true
    databasePodSelector:
      cnpg.io/cluster: postgis1
