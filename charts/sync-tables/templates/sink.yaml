{{- /* The sink: applies what a push source sends, behind the ingress, with mutual TLS
against the push CA. The ingress verifies the client certificate and forwards it, and the
sink checks it again (--require-upstream-client-cert), so an ingress that does not verify
makes every push fail instead of opening the route. See values.yaml `sink.ingressFlavor`. */}}
{{- if .Values.sink.enabled }}
{{- $s := .Values.sink }}
{{- $name := printf "%s-sink" .Release.Name }}
{{- if not $s.allowSchemas }}
{{- fail "sync-tables: sink.allowSchemas must name at least one schema" }}
{{- end }}
{{- if not (has $s.ingressFlavor (list "traefik" "nginx")) }}
{{- fail (printf "sync-tables: sink.ingressFlavor must be traefik or nginx, got %q" $s.ingressFlavor) }}
{{- end }}
{{- $traefik := eq $s.ingressFlavor "traefik" }}
{{- if and $traefik (not $s.allowSourceRanges) }}
{{- fail "sync-tables: sink.allowSourceRanges is required with the traefik flavor (the source's egress address)" }}
{{- end }}
{{- /* The header the ingress forwards the verified client certificate in. */}}
{{- $certHeader := ternary "X-Forwarded-Tls-Client-Cert" "ssl-client-cert" $traefik }}
{{- /* sync_tables >= 0.8.0: publish the run events a push carries (opt-in). */}}
{{- $ev := $s.events | default dict }}
{{- $events := $ev.enabled | default false }}
{{- $oidcSecret := dict }}
{{- if $events }}
{{- $sec := dig "oidc" "clientSecret" (dict) $ev | default dict }}
{{- $value := dig "oidc" "clientSecretValue" "" $ev | toString }}
{{- if and $value (or $sec.name $sec.key) }}
{{- fail "sync-tables: sink.events.oidc: clientSecretValue (client_secret) or clientSecret (an existing Secret), not both" }}
{{- end }}
{{- if $value }}
{{- $oidcSecret = dict "name" (printf "%s-oidc" $name) "key" "client-secret" "value" $value }}
{{- else if and $sec.name $sec.key }}
{{- $oidcSecret = dict "name" $sec.name "key" $sec.key }}
{{- else }}
{{- fail "sync-tables: sink.events needs the client secret: sync_tables.sink.events.client_secret (oidc.clientSecretValue), or oidc.clientSecret {name, key} of an existing Secret" }}
{{- end }}
{{- end }}
---
# The push CA: the ingress verifies client certificates against it, and the sink checks
# the forwarded certificate against it again.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-ca
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ required "sync-tables: sink.ca is required" $s.ca | quote }}
---
# The sink host's certificate, signed by the push CA: served by the ingress, not by
# cert-manager, so the source can trust the push CA alone.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-tls
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ required "sync-tables: sink.serverCert is required" $s.serverCert | quote }}
  tls.key: {{ required "sync-tables: sink.serverKey is required" $s.serverKey | quote }}
---
{{ include "sync-tables.tokensSecret" (dict "root" . "name" $name "role" "sink" "v" $s) }}
{{- with $oidcSecret.value }}
---
# svc-sync-tables-sink's secret, for the run events' publisher (the same value policies-shell
# syncs to the realm).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $oidcSecret.name }}
  labels:
    {{- include "sync-tables.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ $oidcSecret.key }}: {{ . | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-allow-schemas
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
data:
  allow-schemas: |
    {{- range $s.allowSchemas }}
    {{ . }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
    app.kubernetes.io/component: sink
spec:
  replicas: {{ $s.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sync-tables
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sink
  template:
    metadata:
      labels:
        {{- include "sync-tables.labels" . | nindent 8 }}
        app.kubernetes.io/component: sink
      annotations:
        checksum/ca: {{ $s.ca | sha256sum }}
        checksum/allow-schemas: {{ toJson $s.allowSchemas | sha256sum }}
        {{- with $s.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "sync-tables.podSpecCommon" . | nindent 6 }}
      containers:
        - name: sink
          image: {{ include "sync-tables.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["receive", "--tls-terminated-upstream", "--require-upstream-client-cert", {{ $certHeader | quote }}{{ if $events }}, "--events"{{ end }}]
          env:
            - name: SYNC_SINK_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "sync-tables: sink.dsnSecret.name is required" $s.dsnSecret.name }}
                  key: {{ $s.dsnSecret.key }}
            - name: SYNC_TOKEN_FILE
              value: /run/sync/tokens
            - name: SYNC_TLS_CA
              value: /run/sync/ca/ca.crt
            - name: SYNC_ALLOW_SCHEMAS_FILE
              value: /etc/sync/allow-schemas
            - name: SYNC_LISTEN
              value: {{ printf "0.0.0.0:%v" $s.listenPort | quote }}
            - name: SYNC_HEALTH_PORT
              value: {{ $s.healthPort | quote }}
            {{- with $s.acceptFrom }}
            - name: SYNC_ACCEPT_FROM
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if $events }}
            {{- with $ev.env }}
            - { name: CELINE_ENV, value: {{ . | quote }} }
            {{- end }}
            - { name: CELINE_MQTT_HOST, value: {{ required "sync-tables: sink.events.mqtt.host is required with events" (dig "mqtt" "host" "" $ev) | quote }} }
            - { name: CELINE_MQTT_PORT, value: {{ dig "mqtt" "port" 1883 $ev | quote }} }
            - { name: CELINE_MQTT_USE_TLS, value: {{ dig "mqtt" "useTls" false $ev | toString | quote }} }
            - { name: CELINE_OIDC_BASE_URL, value: {{ required "sync-tables: sink.events.oidc.baseUrl is required with events" (dig "oidc" "baseUrl" "" $ev) | quote }} }
            - { name: CELINE_OIDC_CLIENT_ID, value: {{ dig "oidc" "clientId" "svc-sync-tables-sink" $ev | quote }} }
            - name: CELINE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $oidcSecret.name }}
                  key: {{ $oidcSecret.key }}
            {{- end }}
            {{- include "sync-tables.authLimitsEnv" ($s.authLimits | default dict) | nindent 12 }}
          ports:
            - { name: sync, containerPort: {{ $s.listenPort }} }
            - { name: health, containerPort: {{ $s.healthPort }} }
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with $s.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: tokens, mountPath: /run/sync/tokens, readOnly: true }
            - { name: ca, mountPath: /run/sync/ca, readOnly: true }
            - { name: allow-schemas, mountPath: /etc/sync, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tokens
          secret:
            secretName: {{ $name }}-tokens
            defaultMode: 0440
        - name: ca
          secret:
            secretName: {{ $name }}-ca
            defaultMode: 0444
        - name: allow-schemas
          configMap:
            name: {{ $name }}-allow-schemas
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: sync-tables
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sink
  ports:
    - { name: sync, port: {{ $s.listenPort }}, targetPort: sync }
{{- if $s.podDisruptionBudget.enabled }}
---
# No voluntary disruption: a node drain or scale-down waits for the operator instead of
# cutting a push in the middle (the source reports it as HTTP 503).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sync-tables
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sink
{{- end }}
{{- if $traefik }}
---
# Traefik, natively: a client certificate from the push CA is required at the handshake
# for this host (sniStrict: no handshake without the host's name).
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: {{ $name }}
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
spec:
  minVersion: VersionTLS12
  sniStrict: true
  clientAuth:
    secretNames: [{{ printf "%s-ca" $name | quote }}]
    clientAuthType: RequireAndVerifyClientCert
---
# Only the source's egress address. Traefik answers anything else with 403, which the
# source reports as `source_refused`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-allow
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- range splitList "," $s.allowSourceRanges }}
      - {{ trim . | quote }}
      {{- end }}
---
# Forward the verified client certificate, for the sink to check again.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-client-cert
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
spec:
  passTLSClientCert:
    pem: true
---
# A plain Ingress (what a tenant may create, and what host admission checks), bound to the
# TLSOption and the two Middlewares by Traefik's Ingress annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ $s.traefik.entryPoint | quote }}
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: {{ printf "%s-%s@kubernetescrd" .Release.Namespace $name | quote }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-allow@kubernetescrd,%s-%s-client-cert@kubernetescrd" .Release.Namespace $name .Release.Namespace $name | quote }}
spec:
  ingressClassName: {{ $s.ingressClassName }}
  tls:
    - hosts: [{{ required "sync-tables: sink.host is required" $s.host | quote }}]
      secretName: {{ $name }}-tls
  rules:
    - host: {{ $s.host | quote }}
      http:
        paths:
          - path: {{ $s.path }}
            pathType: Exact
            backend:
              service:
                name: {{ $name }}
                port: { name: sync }
{{- else }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ printf "%s/%s-ca" .Release.Namespace $name | quote }}
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ $s.proxyTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ $s.proxyTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $s.proxyBodySize | quote }}
    {{- with $s.allowSourceRanges }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $s.ingressClassName }}
  tls:
    - hosts: [{{ required "sync-tables: sink.host is required" $s.host | quote }}]
      secretName: {{ $name }}-tls
  rules:
    - host: {{ $s.host | quote }}
      http:
        paths:
          - path: {{ $s.path }}
            pathType: Exact
            backend:
              service:
                name: {{ $name }}
                port: { name: sync }
{{- end }}
{{- if $s.networkPolicy.enabled }}
---
# In: the ingress controller only. Out: DNS and the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "sync-tables.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sync-tables
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sink
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $s.networkPolicy.ingressNamespace }}
      ports:
        - { protocol: TCP, port: {{ $s.listenPort }} }
  egress:
    {{- include "sync-tables.dnsEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $s.networkPolicy.databasePodSelector | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
    {{- if $events }}
    # The run events: the broker, and the issuer for the client's token.
    - ports:
        - { protocol: TCP, port: {{ dig "mqtt" "port" 1883 $ev }} }
        - { protocol: TCP, port: 443 }
    {{- end }}
{{- end }}
{{- end }}
