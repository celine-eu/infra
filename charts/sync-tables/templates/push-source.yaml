{{- /* One push source per target: `pushSource` itself (enabled), named <release>-push, and
       each enabled entry of `pushTargets`, named <release>-push-<key>, whose keys override
       `pushSource`'s (to, sinkUrl, the TLS material, token, profile, schedule, …). */}}
{{- $targets := list }}
{{- if .Values.pushSource.enabled }}
{{- $targets = append $targets (dict "name" (printf "%s-push" .Release.Name) "p" .Values.pushSource) }}
{{- end }}
{{- range $key, $t := .Values.pushTargets }}
{{- /* A relay of the same key replaces this CronJob (relay.yaml). */}}
{{- $relayOn := and (hasKey ($.Values.relays | default dict) $key) (ne (toString (dig "enabled" true (index $.Values.relays $key))) "false") }}
{{- if and (ne (toString (dig "enabled" true $t)) "false") (not $relayOn) }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $key) }}
{{- fail (printf "sync-tables: pushTargets key %q is not a DNS label" $key) }}
{{- end }}
{{- $p := mergeOverwrite (deepCopy $.Values.pushSource) (omit $t "enabled") }}
{{- $targets = append $targets (dict "name" (printf "%s-push-%s" $.Release.Name $key) "p" $p) }}
{{- end }}
{{- end }}
{{- range $targets }}
{{- include "sync-tables.pushSource" (dict "root" $ "p" .p "name" .name) }}
{{- end }}
