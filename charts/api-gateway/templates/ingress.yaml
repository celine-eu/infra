{{- $root := . }}
{{- /* Traefik mode (`traefik.enabled`, infra's ingress_controller.annotations: traefik): the
       same routes as Prefix paths, the prefix stripped by a Middleware (nginx: rewrite-target
       /$2 on `/<name>(/|$)(.*)`), forward auth by the namespace's oauth2-proxy Middleware,
       the headers by api-gateway-security-headers' Middleware (security-headers.yaml). */}}
{{- $t := .Values.traefik | default dict }}
{{- $tk := $t.enabled }}
{{- $domain := .Values.domain }}
{{- $authUrl := .Values.auth.url | default (printf "https://sso.%s/oauth2/auth" $domain) }}
{{- $authSignin := .Values.auth.signin | default (printf "https://sso.%s/oauth2/start?rd=$scheme://$host$request_uri" $domain) }}
{{- /* A service that sets its own security headers (`ownSecurityHeaders`) goes on a second
       Ingress without the gateway's: ingress-nginx's custom headers replace a header of
       the same name that the service sent. */}}
{{- $headersOn := (.Values.securityHeaders | default dict).enabled }}
{{- $withHeaders := list }}
{{- $ownHeaders := list }}
{{- range .Values.services }}
{{- if and $headersOn .ownSecurityHeaders }}{{ $ownHeaders = append $ownHeaders . }}{{ else }}{{ $withHeaders = append $withHeaders . }}{{ end }}
{{- end }}
{{- range $i, $group := list $withHeaders $ownHeaders }}
{{- if $group }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ eq $i 0 | ternary "api-gateway" "api-gateway-own-headers" }}
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  annotations:
    {{- if $tk }}
    {{- $mws := list }}
    {{- if and $headersOn (eq $i 0) }}{{ $mws = append $mws "api-gateway-security-headers" }}{{ end }}
    {{- if $root.Values.auth.enabled }}{{ $mws = append $mws ($t.authMiddleware | default "oauth2-proxy-auth") }}{{ end }}
    {{- $mws = append $mws (printf "%s-strip" (eq $i 0 | ternary "api-gateway" "api-gateway-own-headers")) }}
    {{- if $t.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $t.clusterIssuer }}
    {{- else }}
    cert-manager.io/issuer: {{ $root.Values.issuer | default "celine-tls" }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ $t.entrypoint | default "websecure" }}
    {{- $refs := list }}
    {{- range $mws }}{{ $refs = append $refs (printf "%s-%s@kubernetescrd" $root.Release.Namespace .) }}{{ end }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $refs | quote }}
    {{- else }}
    cert-manager.io/issuer: {{ $root.Values.issuer | default "celine-tls" }}
    {{- if and $headersOn (eq $i 0) }}
    nginx.ingress.kubernetes.io/custom-headers: {{ printf "%s/api-gateway-security-headers" $root.Release.Namespace | quote }}
    {{- end }}
    {{- if $root.Values.auth.enabled }}
    nginx.ingress.kubernetes.io/auth-url: {{ $authUrl | quote }}
    nginx.ingress.kubernetes.io/auth-signin: {{ $authSignin | quote }}
    nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, X-Auth-Request-Email, X-Auth-Request-User"
    {{- end }}
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingressClassName | default "nginx" }}
  rules:
    - host: api.{{ $domain }}
      http:
        paths:
          {{- range $group }}
          {{- if $tk }}
          - path: /{{ .name }}
            pathType: Prefix
          {{- else }}
          - path: /{{ .name }}(/|$)(.*)
            pathType: ImplementationSpecific
          {{- end }}
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
          {{- end }}

  {{- if $root.Values.tls.enabled }}
  tls:
    - hosts:
        - api.{{ $domain }}
      secretName: {{ $root.Values.tls.secretName | default "api-gateway-tls" }}
  {{- end }}
{{- if $tk }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ eq $i 0 | ternary "api-gateway" "api-gateway-own-headers" }}-strip
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: {{ $root.Release.Name }}
spec:
  stripPrefix:
    prefixes:
      {{- range $group }}
      - /{{ .name }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
