{{- if .Values.ingress.enabled }}
{{- $fullname := include "celine-services.fullname" . }}
{{- $tlsSecret := .Values.ingress.tls.secretName | default (printf "%s-tls" $fullname) }}
---
# Public: the wizard pages, and every /api path not listed in ingress.authPaths.
# The wizard is anonymous by design; the API rate-limits it per client address.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/issuer: {{ .Values.ingress.issuer | default "celine-tls" }}
    {{- with include "celine-services.securityHeaders.annotation" . }}{{ . | nindent 4 }}{{ end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ $tlsSecret }}
  {{- end }}
---
# The API's public surface, straight to the API service. A separate Ingress so
# the body-size limit applies to the API only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/issuer: {{ .Values.ingress.issuer | default "celine-tls" }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.apiBodySize | default "12m" | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.apiBackend.service }}
                port:
                  number: {{ .Values.ingress.apiBackend.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ $tlsSecret }}
  {{- end }}
{{- if .Values.ingress.auth.enabled }}
---
# The authenticated API paths (operator console, the member's own surface).
# auth-url turns the oauth2-proxy session, or a bearer token, into
# X-Auth-Request-Access-Token, which the API verifies itself. No auth-signin: a
# lapsed session reaches the UI as a 401 and the UI sends the browser to
# /oauth2/sign_in, rather than fetch() meeting a cross-origin 302.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-api-auth
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/issuer: {{ .Values.ingress.issuer | default "celine-tls" }}
    nginx.ingress.kubernetes.io/auth-url: "https://sso.{{ .Values.ingress.domain }}/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, X-Auth-Request-Email, X-Auth-Request-User, X-Auth-Request-Access-Token"
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.apiBodySize | default "12m" | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range .Values.ingress.authPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.ingress.apiBackend.service }}
                port:
                  number: {{ $.Values.ingress.apiBackend.port }}
          {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ $tlsSecret }}
  {{- end }}
---
# Sign-out, step 1: clear the oauth2-proxy session, then /keycloak-logout.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-signout
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/issuer: {{ .Values.ingress.issuer | default "celine-tls" }}
    {{- with include "celine-services.securityHeaders.annotation" . }}{{ . | nindent 4 }}{{ end }}
    nginx.ingress.kubernetes.io/permanent-redirect: "https://sso.{{ .Values.ingress.domain }}/oauth2/sign_out?rd=https://{{ .Values.ingress.host }}/keycloak-logout"
    nginx.ingress.kubernetes.io/permanent-redirect-code: "302"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /oauth2/sign_out
            pathType: Exact
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ $tlsSecret }}
  {{- end }}
---
# Sign-out, step 2: Keycloak's logout, back to this host. Keycloak checks
# post_logout_redirect_uri against the oauth2_proxy client's allowed list.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-keycloak-logout
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/issuer: {{ .Values.ingress.issuer | default "celine-tls" }}
    {{- with include "celine-services.securityHeaders.annotation" . }}{{ . | nindent 4 }}{{ end }}
    nginx.ingress.kubernetes.io/permanent-redirect: "https://keycloak.{{ .Values.ingress.domain }}/realms/celine/protocol/openid-connect/logout?client_id=oauth2_proxy&post_logout_redirect_uri=https://{{ .Values.ingress.host }}/"
    nginx.ingress.kubernetes.io/permanent-redirect-code: "302"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /keycloak-logout
            pathType: Exact
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ $tlsSecret }}
  {{- end }}
{{- end }}
{{- end }}
