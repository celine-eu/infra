{{- $tk := include "celine-services.traefik.on" . }}
{{- $fn := include "celine-services.fullname" . }}
{{- if .Values.ingress.enabled }}
{{- $fullname := include "celine-services.fullname" . }}
---
# Public by design: legal documents are read before anyone signs in, so no oauth2-proxy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
  annotations:
    {{- if $tk }}
    {{- include "celine-services.traefik.annotations" (dict "root" . "middlewares" (list (include "celine-services.securityHeaders.middleware" .))) | nindent 4 }}
    {{- with include "celine-services.traefik.extraAnnotations" (dict "root" . "annotations" .Values.ingress.annotations) }}{{ . | nindent 4 }}{{ end }}
    {{- else }}
    cert-manager.io/issuer: {{ .Values.ingress.issuer | default "celine-tls" }}
    {{- with include "celine-services.securityHeaders.annotation" . }}{{ . | nindent 4 }}{{ end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingressClassName | default "nginx" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" $fullname) }}
  {{- end }}
{{- end }}
