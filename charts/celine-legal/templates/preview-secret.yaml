{{- if .Values.preview.token }}
{{- if lt (len .Values.preview.token) 32 }}
{{- fail "legal preview.token must be at least 32 characters (e.g. `openssl rand -hex 32`), or empty for no preview" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celine-services.fullname" . }}-preview
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.preview.token | quote }}
{{- end }}
