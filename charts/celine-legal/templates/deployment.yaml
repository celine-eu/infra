{{- if and .Values.draft.enabled (not (regexMatch "^[0-9a-f]{40}$" (.Values.draft.revision | default ""))) }}
{{- fail "draft.enabled: draft.revision must be the full 40-hex commit of the deployment's legal data" }}
{{- end }}
{{- $features := .Values.features | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "celine-services.fullname" . }}
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "celine-services.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "celine-services.selectorLabels" . | nindent 8 }}
      annotations:
        # A change to the data, the draft or the features restarts the pod: the host lays
        # everything out once, at startup.
        checksum/data: {{ toJson (list .Values.data.files .Values.draft .Values.release $features) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser | default 1000 }}
      containers:
        - name: legal
          image: "{{ .Values.image.repository }}:{{ required "image.tag: a released celine-legal version (vX.Y.Z)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: LEGAL_DATA
              value: /data
            {{- if .Values.draft.enabled }}
            # The draft for review at /draft/<revision>/; the root serves releases only.
            - name: LEGAL_REVISION
              value: {{ .Values.draft.revision | quote }}
            {{- end }}
            {{- with .Values.release }}
            - name: LEGAL_RELEASE
              value: {{ . | quote }}
            {{- end }}
            {{- range $name, $on := $features }}
            - name: LEGAL_FEATURE_{{ $name | upper }}
              value: {{ ternary "true" "false" (eq (toString $on) "true") | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.healthCheck.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          configMap:
            name: {{ include "celine-services.fullname" . }}-data
            items:
              {{- range $path, $_ := .Values.data.files }}
              - key: {{ include "celine-legal.dataKey" $path }}
                path: {{ $path }}
              {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
