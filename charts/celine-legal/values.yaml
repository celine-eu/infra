## ----------------------------------------------------------------------------
## celine-legal — values.yaml
##
## The legal host: every legal document a deployment publishes (privacy notices, terms
## of use, data-sharing notices, …), from the generic image `ghcr.io/celine-eu/celine-legal`
## and the deployment's own data (`data.files`, mounted at /data).
##
## One host, two sites that never meet:
## - the root serves the published releases only (the frozen editions in the data). This is
##   what applications link (`LEGAL_BASE_URL`) and record acceptances against. A document
##   with nothing published answers "not yet available".
## - with `draft.enabled`, `/draft/<draft.revision>/` serves the data as it is now, for the
##   parties to review: every page marked not valid. The link is the access; nothing else
##   links it.
##
## The image runs as a non-root user with a read-only root filesystem, lays everything out
## once at startup (the pod restarts when the data changes), and answers /healthz.
##
## Public on purpose, without oauth2-proxy: a privacy notice or terms of use must be readable
## before anyone signs in.
## ----------------------------------------------------------------------------

fullnameOverride: legal

image:
  repository: ghcr.io/celine-eu/celine-legal
  tag: ""                 # required: a released version, vX.Y.Z
  pullPolicy: IfNotPresent

# The deployment's legal data: path under /data -> text (register.yaml, parties.yaml, the
# identities, the offers, editions/…). Provided by the deployment's private values.
data:
  files: {}

# The draft for review, at /draft/<revision>/: the full 40-hex commit of the data.
draft:
  enabled: false
  revision: ""

# Pins the stable site to a release (vX.Y.Z): the pod does not start unless it is the newest
# the data has published. Empty: whatever is published.
release: ""

# The optional features the texts describe, name -> true/false (LEGAL_FEATURE_<NAME>).
# Empty: the data's own declarations.
features: {}

imagePullSecrets: []

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  host: "legal.celine.test"
  issuer: celine-tls
  tls:
    enabled: true
    secretName: ""
  annotations: {}

# Response headers ingress-nginx adds on this host (custom-headers; README "Security
# headers"). Off only in the dev environment. The pages carry no script, one inline <style>
# block (celine-legal's page templates), no fetch, no font or image from elsewhere.
securityHeaders:
  enabled: true
  referrerPolicy: strict-origin-when-cross-origin
  csp:
    reportOnly: false
    directives:
      default-src: "'none'"
      style-src: "'unsafe-inline'"
      img-src: "'self'"
      base-uri: "'none'"
      form-action: "'none'"
      frame-ancestors: "'none'"

podSecurityContext:
  runAsUser: 1000

healthCheck:
  enabled: true

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
