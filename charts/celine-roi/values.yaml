## ----------------------------------------------------------------------------
## celine-roi — values.yaml
##
## FastAPI calculation engine for PV/CER financial analysis. Public by design: the
## calculators take no token and are reached through celine-frontend-roi's ingress, which
## routes only the calculator's API paths here. Stores estimates and feedback in Postgres;
## stored estimates are readable only with the realm role platform-admin.
## ----------------------------------------------------------------------------

fullnameOverride: roi

image:
  repository: ghcr.io/celine-eu/celine-roi
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

# --------------------------------------------------------------------------
# Ingress — disabled, reached through celine-frontend-roi's ingress (no sign-in)
# --------------------------------------------------------------------------
ingress:
  enabled: false
  domain: celine.test
  host: "roi.celine.test"
  issuer: celine-tls
  auth:
    enabled: true
  tls:
    enabled: true
    secretName: ""
  annotations: {}

# --------------------------------------------------------------------------
# OIDC — verifies the tokens of the feedback and estimates routes
# --------------------------------------------------------------------------
oidc:
  baseUrl: "http://keycloak/realms/celine"
  jwksUri: "http://keycloak/realms/celine/protocol/openid-connect/certs"
  allowedAudiences: ""
  includeClientIdAsAudience: false
  timeout: 10.0
  service:
    passthrough: true
    clientId: ""
    audience: "oauth2_proxy"
    clientSecret: ""

# --------------------------------------------------------------------------
# Postgres — estimates and feedback (asyncpg); DATABASE_URL from this secret
# --------------------------------------------------------------------------
postgres:
  existingSecret: "postgis1-roi-connection-string"

# --------------------------------------------------------------------------
# Alembic migration — `alembic upgrade head` in an init container
# --------------------------------------------------------------------------
migrate:
  enabled: true

# --------------------------------------------------------------------------
# Health check
# --------------------------------------------------------------------------
healthCheck:
  enabled: true
  path: /docs
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3

# --------------------------------------------------------------------------
# Policies — required by celine-services helpers
# --------------------------------------------------------------------------
policies:
  dir: "/app/policies"
  dataDir: ""
  cacheEnabled: false
  cacheTtl: 300
  cacheMaxsize: 10000

# --------------------------------------------------------------------------
# App config — YAML configs baked into the image under /app/config
# --------------------------------------------------------------------------
extraEnv:
  - name: CELINE_CONFIG_DIR
    value: "/app/config"

extraSecrets: {}

podAnnotations: {}
podSecurityContext:
  runAsUser: 1000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}

volumeMounts: []
volumes: []

logLevel: "INFO"
