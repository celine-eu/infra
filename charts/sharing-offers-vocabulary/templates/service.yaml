apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sharing-offers-vocabulary.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sharing-offers-vocabulary.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.port }}, targetPort: http}
{{- if .Values.networkPolicy.enabled }}
---
# In: onboarding's pods only. Out: nothing (it serves a file).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sharing-offers-vocabulary.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sharing-offers-vocabulary.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.from | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.port }}}
  egress: []
{{- end }}
