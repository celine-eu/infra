{{- $tk := include "celine-services.traefik.on" . }}
{{- $fn := include "celine-services.fullname" . }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "celine-services.fullname" . }}
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
  annotations:
    {{- if $tk }}
    {{- include "celine-services.traefik.annotations" (dict "root" . "middlewares" (list (include "celine-services.securityHeaders.middleware" .) (ternary (include "celine-services.traefik.authMiddleware" .) "" (.Values.ingress.auth.enabled | default false)))) | nindent 4 }}
    {{- with include "celine-services.traefik.extraAnnotations" (dict "root" . "annotations" .Values.ingress.annotations) }}{{ . | nindent 4 }}{{ end }}
    {{- else }}
    cert-manager.io/issuer: {{ .Values.ingress.issuer | default "celine-tls" }}
    {{- with include "celine-services.securityHeaders.annotation" . }}{{ . | nindent 4 }}{{ end }}
    {{- if .Values.ingress.auth.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "https://sso.{{ .Values.ingress.domain }}/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://sso.{{ .Values.ingress.domain }}/oauth2/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, X-Auth-Request-Email, X-Auth-Request-User, X-Auth-Request-Access-Token"
    # The auth answer carries the access token twice (Authorization and
    # X-Auth-Request-Access-Token): past nginx's default buffer it fails as "upstream sent too
    # big header" and every page answers 500.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingressClassName | default "nginx" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.apiBackend.service }}
                port:
                  number: {{ .Values.ingress.apiBackend.port }}
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "celine-services.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "celine-services.fullname" .)) }}
  {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.auth.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "celine-services.fullname" . }}-signout
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
  annotations:
    {{- if $tk }}
    {{- include "celine-services.traefik.annotations" (dict "root" . "middlewares" (list (include "celine-services.securityHeaders.middleware" .) (printf "%s-signout" $fn))) | nindent 4 }}
    {{- else }}
    cert-manager.io/issuer: {{ .Values.ingress.issuer | default "celine-tls" }}
    {{- with include "celine-services.securityHeaders.annotation" . }}{{ . | nindent 4 }}{{ end }}
    nginx.ingress.kubernetes.io/permanent-redirect: "https://sso.{{ .Values.ingress.domain }}/oauth2/sign_out?rd=https://{{ .Values.ingress.host }}/keycloak-logout"
    nginx.ingress.kubernetes.io/permanent-redirect-code: "302"
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingressClassName | default "nginx" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Prefix, not Exact: Traefik ranks routers by rule length and writes a Prefix
          # longer, so an Exact path here lost to /oauth2 (tests/ingress-routing).
          - path: /oauth2/sign_out
            pathType: Prefix
            backend:
              service:
                name: {{ include "celine-services.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "celine-services.fullname" .)) }}
  {{- end }}
{{- if $tk }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "celine-services.fullname" . }}-signout
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
spec:
  redirectRegex:
    regex: "^.*$"
    replacement: "https://sso.{{ .Values.ingress.domain }}/oauth2/sign_out?rd=https://{{ .Values.ingress.host }}/keycloak-logout"
    permanent: false
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "celine-services.fullname" . }}-keycloak-logout
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
  annotations:
    {{- if $tk }}
    {{- include "celine-services.traefik.annotations" (dict "root" . "middlewares" (list (include "celine-services.securityHeaders.middleware" .) (printf "%s-keycloak-logout" $fn))) | nindent 4 }}
    {{- else }}
    cert-manager.io/issuer: {{ .Values.ingress.issuer | default "celine-tls" }}
    {{- with include "celine-services.securityHeaders.annotation" . }}{{ . | nindent 4 }}{{ end }}
    nginx.ingress.kubernetes.io/permanent-redirect: "{{ .Values.ingress.keycloakRealmUrl | default (printf "https://keycloak.%s/realms/celine" .Values.ingress.domain) }}/protocol/openid-connect/logout?client_id=oauth2_proxy&post_logout_redirect_uri=https://{{ .Values.ingress.host }}/"
    nginx.ingress.kubernetes.io/permanent-redirect-code: "302"
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingressClassName | default "nginx" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /keycloak-logout
            pathType: Exact
            backend:
              service:
                name: {{ include "celine-services.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "celine-services.fullname" .)) }}
  {{- end }}
{{- if $tk }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "celine-services.fullname" . }}-keycloak-logout
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
spec:
  redirectRegex:
    regex: "^.*$"
    replacement: "{{ .Values.ingress.keycloakRealmUrl | default (printf "https://keycloak.%s/realms/celine" .Values.ingress.domain) }}/protocol/openid-connect/logout?client_id=oauth2_proxy&post_logout_redirect_uri=https://{{ .Values.ingress.host }}/"
    permanent: false
{{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.assistantBackend.service }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "celine-services.fullname" . }}-assistant
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
  annotations:
    {{- if $tk }}
    {{- include "celine-services.traefik.annotations" (dict "root" . "middlewares" (list (ternary (include "celine-services.traefik.authMiddleware" .) "" (.Values.ingress.auth.enabled | default false)) (printf "%s-assistant-strip" $fn))) | nindent 4 }}
    {{- else }}
    cert-manager.io/issuer: {{ .Values.ingress.issuer | default "celine-tls" }}
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- if .Values.ingress.auth.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "https://sso.{{ .Values.ingress.domain }}/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://sso.{{ .Values.ingress.domain }}/oauth2/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, X-Auth-Request-Email, X-Auth-Request-User, X-Auth-Request-Access-Token"
    # The auth answer carries the access token twice (Authorization and
    # X-Auth-Request-Access-Token): past nginx's default buffer it fails as "upstream sent too
    # big header" and every page answers 500.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingressClassName | default "nginx" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if $tk }}
          - path: /api/assistant
            pathType: Prefix
          {{- else }}
          - path: /api/assistant(/|$)(.*)
            pathType: ImplementationSpecific
          {{- end }}
            backend:
              service:
                name: {{ .Values.ingress.assistantBackend.service }}
                port:
                  number: {{ .Values.ingress.assistantBackend.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "celine-services.fullname" .)) }}
  {{- end }}
{{- if $tk }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "celine-services.fullname" . }}-assistant-strip
  labels:
    {{- include "celine-services.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes: ["/api/assistant"]
{{- end }}
{{- end }}
