## ----------------------------------------------------------------------------
## celine-frontend-webapp — values.yaml
## ----------------------------------------------------------------------------

fullnameOverride: frontend-webapp

image:
  repository: ghcr.io/celine-eu/celine-frontend-webapp
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3005

ingress:
  enabled: true
  domain: celine.test
  host: "webapp.celine.test"
  issuer: celine-tls

  assistantBackend:
    service: ai-assistant
    port: 8012
  apiBackend:
    service: webapp
    port: 8014

  auth:
    enabled: true
  tls:
    enabled: true
    secretName: ""
  annotations: {}

# Response headers ingress-nginx adds on this host's Ingresses (custom-headers; README
# "Security headers"). Off only in the dev environment.
# SvelteKit (adapter-node, no kit.csp): an inline bootstrap and theme script, inline
# style attributes. Same-origin /api (the assistant through /api/assistant, which keeps
# its own headers), the service worker /sw.js, blob: attachment previews, data: images
# from html2canvas.
securityHeaders:
  enabled: true
  referrerPolicy: strict-origin-when-cross-origin
  csp:
    # The app sends its own Content-Security-Policy (kit.csp in its svelte.config.js), with a
    # per-request nonce for SvelteKit's inline bootstrap: no 'unsafe-inline' in script-src.
    # The controller would replace it, so this ConfigMap carries none (README "Security headers").
    sentByApp: true
    reportOnly: false

healthCheck:
  enabled: true
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3

extraEnv: []
podAnnotations: {}
podSecurityContext:
  runAsUser: 1000
resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 100m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
