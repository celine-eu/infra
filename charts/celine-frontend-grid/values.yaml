## ----------------------------------------------------------------------------
## celine-frontend-grid — values.yaml
## ----------------------------------------------------------------------------

fullnameOverride: frontend-grid

image:
  repository: ghcr.io/celine-eu/celine-frontend-grid
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3006

ingress:
  enabled: true
  domain: celine.test
  host: "grid.celine.test"
  issuer: celine-tls

  gridBackend:
    service: grid
    port: 8015

  auth:
    enabled: true
  tls:
    enabled: true
    secretName: ""
  annotations: {}

# Response headers ingress-nginx adds on this host's Ingresses (custom-headers; README
# "Security headers"). Off only in the dev environment.
# SvelteKit (adapter-node, ssr off, no kit.csp) with MapLibre: an inline bootstrap and
# theme script, inline style attributes, a blob: map worker, the CARTO basemap styles,
# tiles, sprites and glyphs and the ArcGIS imagery, fetched. Report-Only until the
# browser reports nothing on the map pages (README "Security headers").
securityHeaders:
  enabled: true
  referrerPolicy: strict-origin-when-cross-origin
  csp:
    reportOnly: true
    directives:
      default-src: "'self'"
      script-src: "'self' 'unsafe-inline'"
      style-src: "'self' 'unsafe-inline'"
      img-src: "'self' data: blob: https://*.basemaps.cartocdn.com https://server.arcgisonline.com"
      font-src: "'self'"
      connect-src: "'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://server.arcgisonline.com"
      worker-src: "'self' blob:"
      child-src: "'self' blob:"
      object-src: "'none'"
      base-uri: "'self'"
      form-action: "'self' https://sso.{{ .Values.ingress.domain }} https://keycloak.{{ .Values.ingress.domain }}"
      frame-ancestors: "'none'"

healthCheck:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3

extraEnv: []
podAnnotations: {}
podSecurityContext:
  runAsUser: 1000
resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 100m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
