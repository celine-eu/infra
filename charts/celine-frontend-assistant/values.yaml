## ----------------------------------------------------------------------------
## celine-frontend-assistant — values.yaml
## ----------------------------------------------------------------------------

fullnameOverride: frontend-assistant

image:
    repository: ghcr.io/celine-eu/celine-frontend-assistant
    tag: "latest"
    pullPolicy: IfNotPresent

replicaCount: 1

service:
    type: ClusterIP
    port: 3003

ingress:
    enabled: true
    domain: celine.test
    host: "assistant.celine.test"
    issuer: celine-tls
    apiBackend:
        service: ai-assistant
        port: 8012
    auth:
        enabled: true
    tls:
        enabled: true
        secretName: ""
    annotations: {}

# Response headers ingress-nginx adds on this host's Ingresses (custom-headers; README
# "Security headers"). Off only in the dev environment.
# SvelteKit (adapter-node, no kit.csp): an inline bootstrap script, inline style
# attributes. Same-origin /api, blob: attachment previews. Images an answer links on
# other hosts are not shown.
securityHeaders:
  enabled: true
  referrerPolicy: strict-origin-when-cross-origin
  csp:
    reportOnly: false
    directives:
      default-src: "'self'"
      script-src: "'self' 'unsafe-inline'"
      style-src: "'self' 'unsafe-inline'"
      img-src: "'self' data: blob:"
      font-src: "'self'"
      connect-src: "'self'"
      object-src: "'none'"
      base-uri: "'self'"
      form-action: "'self' https://sso.{{ .Values.ingress.domain }} https://keycloak.{{ .Values.ingress.domain }}"
      frame-ancestors: "'none'"

healthCheck:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3

# Not used but required by celine-services shared templates
oidc:
    baseUrl: ""
    jwksUri: ""
    allowedAudiences: ""
    includeClientIdAsAudience: false
    timeout: 10.0
    service:
        passthrough: true
        clientId: ""
        audience: ""
        clientSecret: ""

policies:
    dir: "/app/policies"
    dataDir: ""
    cacheEnabled: false
    cacheTtl: 300
    cacheMaxsize: 10000

extraEnv: []
extraSecrets: {}
podAnnotations: {}
podSecurityContext:
    runAsUser: 1000
resources:
    requests:
        cpu: 50m
        memory: 256Mi
    limits:
        cpu: 100m
        memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
volumeMounts: []
volumes: []
logLevel: "INFO"
migrate:
    enabled: false
