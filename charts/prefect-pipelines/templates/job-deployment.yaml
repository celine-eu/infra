{{- range $i, $flow := .Values.flows }}
apiVersion: batch/v1
kind: Job
metadata:
  name: prefect-deploy-{{ $flow.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: prefect-pipeline-deploy

spec:
  ttlSecondsAfterFinished: 30
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: prefect-worker
      {{- if $flow.imageSecret }}
      imagePullSecrets:
        - name: {{ $flow.imageSecret }}
      {{- end }}
      containers:
        - name: prefect-deploy-{{ $flow.name }}
          image: {{ $flow.image }}
          imagePullPolicy: {{ $flow.pullPolicy | default "IfNotPresent" }}
          env:
            # Render all global envs, except those a flow entry of the same name replaces: a name may
            # appear once, or the Deployment cannot be patched.
            {{- $flowNames := list }}
            {{- range $flow.env }}{{ $flowNames = append $flowNames .name }}{{ end }}
            {{- range $.Values.global.env }}
            {{- if has .name $flowNames }}
            {{- else if .value }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- else if .secret }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: {{ default .name .key }}
            {{- end }}
            {{- end }}

            # Render all flow-level envs
            {{- range $flow.env }}
            {{- if .value }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- else if .secret }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: {{ default .name .key }}
            {{- end }}
            {{- end }}

          resources:
            {{- if $flow.resources }}
            {{- toYaml $flow.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: "125m"
              memory: "128Mi"
              ephemeral-storage: "500Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
              ephemeral-storage: "4Gi"
            {{- end }}
          command:
            - "bash"
            - "-c"
            - |
              set -eux
              sleep {{ $i }}
              echo "Building prefect.yaml for {{ $flow.name }}"
              mkdir -p /config

              # Quoted heredoc: the shell expands nothing, so no value of the Job's env
              # (secrets included) can land in the deployment.
              cat > /config/prefect.yaml <<'EOF'
              name: {{ $flow.name }}-deployment
              deployments:
                - name: {{ $flow.name }}-flow
                  description: "{{ $flow.name }} prefect deployment"
                  entrypoint: "{{ $flow.path }}:{{ $flow.callback }}"

                  pull:
                    - prefect.deployments.steps.set_working_directory:
                        directory: {{ dir $flow.path }}

                  # run once at time, assume idempotency
                  concurrency_limit: {{ $flow.concurrencyLimit | default 1 }}
                  collision_strategy: SKIP

                  schedule:
                    cron: {{ ($flow.schedule).cron | default "0 * * * *" | quote }}
                    # catchup: false
                    # active: true

                  work_pool:
                    name: {{ $.Values.global.work_pool }}
                    job_variables:
                      name: pipeline-run-{{ $flow.name }}
                      {{- if $flow.imageSecret }}
                      image_pull_secrets:
                        - name: {{ $flow.imageSecret }}
                      {{- end }}
                      finished_job_ttl: {{ $flow.finishedJobTTL | default "60" }}
                      image_pull_policy: IfNotPresent
                      image: {{ $flow.image }}
                      namespace: {{ $.Values.global.namespace }}
                      # Kubernetes env list: secrets by secretKeyRef (the work pool's base
                      # job template accepts it). A flow entry replaces the global one of
                      # the same name.
                      env:
                      {{- $flowNames := list }}
                      {{- range $flow.env }}{{ $flowNames = append $flowNames .name }}{{ end }}
                      {{- range $.Values.global.env }}
                      {{- if not (has .name $flowNames) }}
                      {{- include "prefect-pipelines.runEnv" . | trim | nindent 24 }}
                      {{- end }}
                      {{- end }}
                      {{- range $flow.env }}
                      {{- include "prefect-pipelines.runEnv" . | trim | nindent 24 }}
                      {{- end }}
              EOF

              echo "Registering Prefect deployment for {{ $flow.name }}"
              prefect deploy --prefect-file /config/prefect.yaml
---
{{- end }}
