{{- range .Values.flows }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-{{ .name }}-shell
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: pipeline-{{ .name }}-shell
spec:
  replicas: {{ .replicaCount | default 0 }}
  selector:
    matchLabels:
      app: pipeline-{{ .name }}-shell
  template:
    metadata:
      labels:
        app: pipeline-{{ .name }}-shell
    spec:
      serviceAccountName: prefect-worker
      {{- if .imageSecret }}
      imagePullSecrets:
        - name: {{ .imageSecret }}
      {{- end }}

      containers:
        - name: pipeline-{{ .name }}-shell
          image: {{ .image }}
          imagePullPolicy: {{ .pullPolicy | default "IfNotPresent" }}
          command:
            - "bash"
            - "-c"
            - |
              echo "Shell pod for pipeline {{ .name }} ready."
              # keep the container alive for exec sessions
              tail -f /dev/null

          env:
            # Global envs, except those a flow entry of the same name replaces: a name may
            # appear once, or the Deployment cannot be patched.
            {{- $flowNames := list }}
            {{- range .env }}{{ $flowNames = append $flowNames .name }}{{ end }}
            {{- range $.Values.global.env }}
            {{- if has .name $flowNames }}
            {{- else if .value }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- else if .secret }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: {{ default .name .key }}
            {{- end }}
            {{- end }}

            # Flow-specific envs
            {{- range .env }}
            {{- if .value }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- else if .secret }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: {{ default .name .key }}
            {{- end }}
            {{- end }}

---
{{- end }}
