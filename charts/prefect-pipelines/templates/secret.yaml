apiVersion: v1
kind: Secret
metadata:
  name: prefect-pipelines-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  CELINE_OIDC_CLIENT_SECRET: {{ .Values.global.oidcClientSecret }}
  {{- /* Further keys a flow reads with {name, secret: prefect-pipelines-secrets, key}, so
         the value never sits in a pod spec (e.g. another site's client secret). */}}
  {{- range $key, $value := .Values.global.extraSecrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
