apiVersion: batch/v1
kind: Job
metadata:
    name: prefect-deploy-cleanup
    namespace: "{{ $.Values.global.namespace }}"
    annotations:
        "helm.sh/hook": pre-upgrade
        "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
        "helm.sh/hook-weight": "-5"
spec:
    ttlSecondsAfterFinished: 10
    template:
        spec:
            restartPolicy: Never
            serviceAccountName: prefect-worker
            {{- with $.Values.global.podSecurityContext }}
            securityContext:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $.Values.global.volumes }}
            volumes:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            containers:
                - name: cleanup
                  # The Kubernetes project's own image (registry.k8s.io): bitnami/kubectl is no
                  # longer published for free. It runs as uid 0 unless the pod says otherwise.
                  image: {{ $.Values.cleanup.image | quote }}
                  {{- with $.Values.global.containerSecurityContext }}
                  securityContext:
                    {{- toYaml . | nindent 20 }}
                  {{- end }}
                  {{- with $.Values.global.volumeMounts }}
                  volumeMounts:
                    {{- toYaml . | nindent 20 }}
                  {{- end }}
                  command:
                      - /bin/kubectl
                      - delete
                      - jobs
                      - -n
                      - "{{ $.Values.global.namespace }}"
                      - -l
                      - app=prefect-pipeline-deploy
                      - --ignore-not-found
                      - --wait=false
