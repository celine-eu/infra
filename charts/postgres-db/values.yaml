cluster:
  name: postgis1
  image: ghcr.io/cloudnative-pg/postgis:17
  instances: 1
  resources:
    requests:
      memory: "8Gi"
      cpu: "2000m"
    limits:
      memory: "12Gi"
      cpu: "4000m"
  storage:
    size: 10Gi
  parameters:
    log_statement: ddl
    shared_buffers: "2GB"
    work_mem: "64MB"
    effective_cache_size: "6GB"
    maintenance_work_mem: "512MB"
    effective_io_concurrency: 200
    random_page_cost: "1.1"
    max_parallel_workers_per_gather: 2
    max_wal_size: "2GB"
    wal_buffers: 64MB

roles: []
  # - name: datasets_owner
  #   password: datasets_owner
  #   comment: "User owning the datasets schema"

  # - name: datasets_ro
  #   password: datasets_ro
  #   comment: "Read-only access to datasets"

  # - name: meltano
  #   password: meltano
  # - name: prefect
  #   password: prefect
  # - name: superset
  #   password: superset
  # - name: keycloak
  #   password: keycloak
  # - name: marquez
  #   password: marquez

databases: []
  # - name: datasets
  #   owner: datasets_owner
  #   extensions:
  #     - postgis
  #     - postgis_topology
  #     - fuzzystrmatch
  #     - postgis_tiger_geocoder

  # - name: keycloak
  #   owner: keycloak

  # - name: superset
  #   owner: superset

  # - name: meltano
  #   owner: meltano

  # - name: prefect
  #   owner: prefect

  # - name: marquez
  #   owner: marquez

# create secrets with full connection details
connection_strings: []
  # - database: prefect
  #   dialect: postgresql+asyncpg

poolers: []
  # - type: rw
  #   instances: 2
  #   poolMode: transaction
  #   image: ghcr.io/cloudnative-pg/pgbouncer:1.24.1@sha256:…   # optional: the operator's otherwise
  #   parameters:
  #     default_pool_size: "25"
  #     max_client_conn: "200"

backup:
  enabled: false
  destinationPath: ""
  retentionPolicy: "7d"
  schedule: "0 2 * * *"
  compression: gzip
  # GCS native (recommended for Google Cloud Storage)
  # destinationPath must use gs:// prefix
  gcs:
    applicationCredentials: ""  # full JSON string of GCS service account key
  # S3-compatible (AWS, MinIO, etc.)
  # destinationPath must use s3:// prefix
  s3:
    endpointURL: ""             # omit for native AWS S3
    accessKey: ""
    secretKey: ""
    # boto3 request/response checksums for barman's S3 client. "" keeps boto3's default;
    # "when_required" for stores that refuse the newer checksums (GCS's XML API answers
    # SignatureDoesNotMatch). Sets AWS_REQUEST_CHECKSUM_CALCULATION and
    # AWS_RESPONSE_CHECKSUM_VALIDATION on the Postgres pods.
    checksums: ""

table_tuning:
  enabled: false
  image: ghcr.io/cloudnative-pg/postgis:17
  databases: []
    # - name: prefect
    #   secret: postgis1-prefect-connection-string
    #   tables:
    #     - name: deployment
    #       options: "fillfactor = 50, autovacuum_vacuum_scale_factor = 0.01, autovacuum_vacuum_cost_delay = 0"

# Read-only grants on one database (templates/grants-job.yaml): USAGE, SELECT and the
# default for future tables on `schemas`, to `role`. Run by the database owner through
# `secret`; schemas that are missing or not the owner's are skipped.
grants:
  enabled: false
  database: datasets
  role: datasets_ro
  secret: ""              # the owner's connection-string Secret (username, password)
  schemas:
    - ds_dev_gold
    - ds_dev_raw
    - ds_dev_silver
    - ds_dev_staging
    - raw
  image: ghcr.io/cloudnative-pg/postgis:17

# The mirror schemas sync_tables' sink writes (templates/mirror-schemas-job.yaml): created
# owned by `role`, which has no CREATE on the database, by the database owner through
# `secret` (the owner needs `inRoles: [<role>]` in `roles`); `readers` get USAGE, SELECT and
# the default for future tables. A schema another role owns is refused.
mirror:
  enabled: false
  database: datasets
  role: mirror_writer
  secret: ""              # the owner's connection-string Secret (username, password)
  schemas: []
  readers: []
  image: ghcr.io/cloudnative-pg/postgis:17

# Resources for the post-deploy Jobs (grants, table tuning). Empty: none set.
jobResources: {}

# The post-deploy Jobs' security contexts: Pod Security `restricted`. They run psql only, as
# the postgis image's postgres user (uid 26, as the CNPG instances do), not as root.
jobPodSecurityContext:
  runAsNonRoot: true
  runAsUser: 26
  runAsGroup: 26
jobSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# The sync environment marker on one database (templates/env-marker-job.yaml).
# `environment` is dev or prod; empty, no Job runs and the database carries no marker.
envMarker:
  environment: ""
  database: datasets
  secret: ""              # the owner's connection-string Secret (username, password)
  image: ghcr.io/cloudnative-pg/postgis:17
