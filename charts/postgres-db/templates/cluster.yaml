apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
spec:

  resources:
    {{- toYaml .Values.cluster.resources | nindent 4 }}

  instances: {{ .Values.cluster.instances }}
  {{- /* barman's S3 client: checksums only where the store requires them (backup.s3.checksums). */}}
  {{- with (and .Values.backup.enabled .Values.backup.s3.checksums) }}
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: {{ . | quote }}
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: {{ . | quote }}
  {{- end }}
  imageName: {{ .Values.cluster.image }}
  storage:
    size: {{ .Values.cluster.storage.size }}
  postgresql:
    parameters:
      {{- range $key, $value := .Values.cluster.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  {{- if .Values.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.backup.destinationPath | quote }}
      {{- if .Values.backup.gcs.applicationCredentials }}
      googleCredentials:
        applicationCredentials:
          name: cnpg-backup-gcs
          key: credentials.json
      {{- else }}
      {{- if .Values.backup.s3.endpointURL }}
      endpointURL: {{ .Values.backup.s3.endpointURL | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: S3_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: S3_SECRET_ACCESS_KEY
      {{- end }}
      wal:
        compression: {{ .Values.backup.compression }}
      data:
        compression: {{ .Values.backup.compression }}
    retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
  {{- end }}
  managed:
    roles:
      {{- range .Values.roles }}
      - name: {{ .name }}
        ensure: present
        comment: {{ default "" .comment | quote }}
        login: true
        superuser: false
        {{- with .inRoles }}
        inRoles: {{ toJson . }}
        {{- end }}
        passwordSecret:
          name: {{ printf "%s-db-secret" .name | replace "_" "-"  }}
      {{- end }}
