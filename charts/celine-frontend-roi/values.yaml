## ----------------------------------------------------------------------------
## celine-frontend-roi — values.yaml
## ----------------------------------------------------------------------------

fullnameOverride: frontend-roi

image:
  repository: ghcr.io/celine-eu/celine-frontend-roi
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3004

ingress:
  enabled: true
  domain: celine.test
  host: "roi.celine.test"
  issuer: celine-tls

  roiBackend:
    service: roi
    port: 8000

  # The roi routes the calculator calls, as path prefixes. Any other /api path never
  # reaches roi: stored estimates (/api/v1/estimates) are for platform administrators,
  # through the Service, not the public host.
  apiPaths:
    - /api/v1/production
    - /api/v1/energy
    - /api/v1/incentives
    - /api/v1/finance
    - /api/v1/validate
    - /api/v1/scenario
    - /api/v1/capex-estimate
    - /api/v1/compare
    - /api/v1/feedback
  # Annotations of the API Ingress only, e.g. the edge rate limit
  # (nginx.ingress.kubernetes.io/limit-rps, limit-connections).
  apiAnnotations: {}

  auth:
    enabled: true
  tls:
    enabled: true
    secretName: ""
  annotations: {}

# Response headers ingress-nginx adds on this host's Ingresses (custom-headers; README
# "Security headers"). Off only in the dev environment.
# SvelteKit (adapter-node, no kit.csp): an inline bootstrap and theme script, inline
# style attributes and injected HTML, OpenStreetMap tiles (Leaflet), address search on
# Nominatim, a static map image for printing, html2canvas and jsPDF for the PDF.
# Report-Only until the browser reports nothing on the calculator and its PDF export
# (README "Security headers").
securityHeaders:
  enabled: true
  referrerPolicy: strict-origin-when-cross-origin
  csp:
    reportOnly: true
    directives:
      default-src: "'self'"
      script-src: "'self' 'unsafe-inline'"
      style-src: "'self' 'unsafe-inline'"
      img-src: "'self' data: blob: https://*.tile.openstreetmap.org https://staticmap.openstreetmap.de"
      font-src: "'self'"
      connect-src: "'self' https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org"
      object-src: "'none'"
      base-uri: "'self'"
      form-action: "'self' https://sso.{{ .Values.ingress.domain }} https://keycloak.{{ .Values.ingress.domain }}"
      frame-ancestors: "'none'"

healthCheck:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3

extraEnv: []
podAnnotations: {}
podSecurityContext:
  runAsUser: 1000
resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 100m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
