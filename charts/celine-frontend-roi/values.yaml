## ----------------------------------------------------------------------------
## celine-frontend-roi — values.yaml
## ----------------------------------------------------------------------------

fullnameOverride: frontend-roi

image:
  repository: ghcr.io/celine-eu/celine-frontend-roi
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3004

ingress:
  enabled: true
  domain: celine.test
  host: "roi.celine.test"
  issuer: celine-tls

  roiBackend:
    service: roi
    port: 8000

  # The roi routes the calculator calls, as path prefixes. Any other /api path never
  # reaches roi: stored estimates (/api/v1/estimates) are for platform administrators,
  # through the Service, not the public host.
  apiPaths:
    - /api/v1/production
    - /api/v1/energy
    - /api/v1/incentives
    - /api/v1/finance
    - /api/v1/validate
    - /api/v1/scenario
    - /api/v1/capex-estimate
    - /api/v1/compare
    - /api/v1/feedback
  # Annotations of the API Ingress only, e.g. the edge rate limit
  # (nginx.ingress.kubernetes.io/limit-rps, limit-connections).
  apiAnnotations: {}

  auth:
    enabled: true
  tls:
    enabled: true
    secretName: ""
  annotations: {}

healthCheck:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3

extraEnv: []
podAnnotations: {}
podSecurityContext:
  runAsUser: 1000
resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 100m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
