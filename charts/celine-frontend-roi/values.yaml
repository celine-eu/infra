## ----------------------------------------------------------------------------
## celine-frontend-roi — values.yaml
## ----------------------------------------------------------------------------

fullnameOverride: frontend-roi

image:
  repository: ghcr.io/celine-eu/celine-frontend-roi
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3004

ingress:
  enabled: true
  domain: celine.test
  host: "roi.celine.test"
  issuer: celine-tls

  roiBackend:
    service: roi
    port: 8000

  # The roi routes the calculator calls, as path prefixes. Any other /api path never
  # reaches roi: stored estimates (/api/v1/estimates) are for platform administrators,
  # through the Service, not the public host.
  apiPaths:
    - /api/v1/production
    - /api/v1/energy
    - /api/v1/incentives
    - /api/v1/finance
    - /api/v1/validate
    - /api/v1/scenario
    - /api/v1/capex-estimate
    - /api/v1/compare
  # The roi routes for visitors who already hold an SSO session (path prefixes): the
  # feedback form. They pass oauth2-proxy's auth check, which hands roi the user's token
  # (X-Auth-Request-Access-Token, Authorization); without a session the request gets a
  # plain 401, never a redirect to sign in. The page and the calculator stay public.
  authPaths:
    - /api/v1/feedback
  # Annotations of the API Ingresses (apiPaths and authPaths), e.g. the edge rate limit
  # (nginx.ingress.kubernetes.io/limit-rps, limit-connections).
  apiAnnotations: {}

  # The whole host behind sign-in (page and calculator). authPaths need a session either way.
  auth:
    enabled: true
  tls:
    enabled: true
    secretName: ""
  annotations: {}

# Response headers ingress-nginx adds on this host's Ingresses (custom-headers; README
# "Security headers"). Off only in the dev environment.
# SvelteKit (adapter-node) with an inline bootstrap and theme script, inline style
# attributes, OpenStreetMap tiles (Leaflet), address search on Nominatim, a static map
# image for printing, html2canvas and jsPDF for the PDF.
securityHeaders:
  enabled: true
  referrerPolicy: strict-origin-when-cross-origin
  csp:
    # The app sends the whole Content-Security-Policy, enforced (kit.csp in its
    # svelte.config.js: a per-request nonce, default-src 'self', each outside host named).
    # The controller would replace it, so this ConfigMap carries none (README "Security
    # headers"). Needs celine-frontend-roi with that policy: an older image would lose
    # its Report-Only trial and keep only its script directives.
    sentByApp: true
    reportOnly: false
  # The calculator's API Ingress (ingress.apiPaths) answers JSON only: it allows nothing.
  apiCsp:
    reportOnly: false
    directives:
      default-src: "'none'"
      frame-ancestors: "'none'"

healthCheck:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3

extraEnv: []
podAnnotations: {}
podSecurityContext:
  runAsUser: 1000
resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 100m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}

# IngressClass of this chart's Ingresses. infra sets it from `ingress_controller.class`.
ingressClassName: nginx
