{{- if .Values.enabled }}
{{- include "celine-member-mirror.check" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celine-member-mirror.fullname" . }}
  labels:
    {{- include "celine-member-mirror.labels" . | nindent 4 }}
type: Opaque
data:
  source-client-secret: {{ .Values.secrets.sourceClientSecret | toString | b64enc | quote }}
  keycloak-admin-client-secret: {{ .Values.secrets.keycloakAdminClientSecret | toString | b64enc | quote }}
  registry-client-secret: {{ .Values.secrets.registryClientSecret | toString | b64enc | quote }}
{{- end }}
