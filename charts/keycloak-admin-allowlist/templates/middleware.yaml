{{- /*
The Traefik ipAllowList Middleware `keycloak-admin-allowlist`: the keycloak release's console
Ingress names it in `traefik.ingress.kubernetes.io/router.middlewares`
(`<namespace>-keycloak-admin-allowlist@kubernetescrd`), and Traefik answers any other source
with 403. A release of its own because the keycloakx chart renders no extra manifests, and
the environment that runs a shared Keycloak installs the keycloak release alone. The checks
repeat infra's (defaults/0020-auth/keycloak-admin-allowlist) for a render outside infra.
*/}}
{{- $ranges := .Values.sourceRanges }}
{{- if not (and (kindIs "slice" $ranges) $ranges) }}
{{- fail "keycloak.admin_public.allow_source_ranges is required when keycloak.admin_public.enabled: a non-empty list of CIDRs, e.g. [192.168.1.47/32]" }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-admin-allowlist
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: keycloak
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
spec:
  ipAllowList:
    sourceRange:
      {{- range $ranges }}
      {{- $range := toString . | trim }}
      {{- if not (regexMatch "^(([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}|[0-9a-fA-F:]+/[0-9]{1,3})$" $range) }}
      {{- fail (printf "keycloak.admin_public.allow_source_ranges: %q is not a CIDR (address/prefix)" $range) }}
      {{- end }}
      {{- if hasSuffix "/0" $range }}
      {{- fail (printf "keycloak.admin_public.allow_source_ranges: %q admits every address" $range) }}
      {{- end }}
      - {{ $range | quote }}
      {{- end }}
